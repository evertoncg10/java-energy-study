name: analise

on:
  push:
    paths: ["analise/**", "dados/**", "config/**", "evidencias/**", "resultados/**", "scripts/**", "Dockerfile", ".github/workflows/analise.yml"]
  pull_request:
    paths: ["analise/**", "dados/**", "config/**", "evidencias/**", "resultados/**", "scripts/**", "Dockerfile", ".github/workflows/analise.yml"]

jobs:
  verificar:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: analise
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar (versões travadas)
        run: python -m pip install -r requisitos-travados.txt -e ".[dev,figuras]"
      - name: Estilo (ruff)
        run: |
          ruff check src tests ../scripts/comparar_resultados.py ../scripts/analisar_pausas.py ../scripts/figuras_artigo_cabecalhos.py
          ruff format --check src tests ../scripts/analisar_pausas.py ../scripts/figuras_artigo_cabecalhos.py
      - name: Tipos (mypy)
        run: |
          mypy
          mypy --strict ../scripts/analisar_pausas.py
          mypy --strict ../scripts/figuras_artigo_cabecalhos.py
      - name: Testes (pytest)
        run: pytest
      - name: Integridade dos dados (manifestos SHA-256)
        working-directory: .
        run: bash scripts/conferir_dados.sh
      - name: Reprodução dos resultados oficiais
        working-directory: .
        run: |
          pae-analise analisar --saida "$RUNNER_TEMP/reproducao" --sem-figuras > /dev/null
          python scripts/comparar_resultados.py resultados/oficial-20261101-termos "$RUNNER_TEMP/reproducao" --ignorar-figuras
      - name: Reprodução do peso das pausas de coleta
        working-directory: .
        run: |
          python scripts/analisar_pausas.py --saida "$RUNNER_TEMP/pausas" > /dev/null
          python scripts/comparar_resultados.py resultados/pausas-gc-20261107 "$RUNNER_TEMP/pausas"
      - name: Figuras do artigo sobre os cabeçalhos compactos
        working-directory: .
        run: python scripts/figuras_artigo_cabecalhos.py --saida "$RUNNER_TEMP/figuras-artigo"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem da análise
        run: docker build -t pae-jvm-analise .
      - name: Reprodução dentro do contêiner
        run: docker run --rm pae-jvm-analise
