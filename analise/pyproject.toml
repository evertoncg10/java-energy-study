[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pae-analise"
version = "0.1.0"
description = "Consolidação e análise estatística das sessões do protocolo PAE-JVM (energia, tempo, potência e coleta de lixo)."
readme = { text = "Análise dos dados do protocolo PAE-JVM. Ver o README do repositório.", content-type = "text/plain" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Everton Cezar Gonçalves" }]
# O núcleo usa só a biblioteca padrão; as figuras são opcionais.
dependencies = []

[project.optional-dependencies]
figuras = ["matplotlib==3.9.2"]
dev = ["pytest==8.3.3", "ruff==0.7.4", "mypy==1.13.0"]

[project.scripts]
pae-analise = "pae_analise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Textos em português usam acentos e travessões.

[tool.ruff.lint.per-file-ignores]
"tests/test_gclog.py" = ["E501"]  # Linhas reais de log, mantidas inteiras.

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["pae_analise"]

[[tool.mypy.overrides]]
# As figuras usam matplotlib sem tipos (Any). Os stubs do numpy, puxados pelo matplotlib, usam sintaxe
# de Python 3.12 e quebram a checagem com python_version 3.10; por isso esses pacotes não são seguidos.
module = ["matplotlib", "matplotlib.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true
